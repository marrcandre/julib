name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: julib
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: julib_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U julib'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://julib:ci-only@127.0.0.1:5432/julib_ci
      SECRET_KEY: ci-disposable-key-not-for-production
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make check
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: make e2e
