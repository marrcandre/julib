[project]
name = "julib-backend"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = ["Django>=5.2,<5.3", "django-ninja>=1.4,<2", "django-allauth[socialaccount]>=65,<66", "psycopg[binary]>=3.2,<4", "dj-database-url>=2,<4", "httpx>=0.28,<1", "cloudinary>=1.44,<2", "whitenoise>=6,<7"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.11", "mypy>=1.15", "django-stubs[compatible-mypy]>=5.2,<5.3"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
[tool.django-stubs]
django_settings_module = "config.settings"

[tool.vercel]
entrypoint = "config.wsgi:app"
